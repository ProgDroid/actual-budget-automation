[package]
name = "actual-budget-automation"
version = "0.1.0"
edition = "2024"
# File::lock() (src/lock.rs) stabilised in 1.89; Duration::from_mins() in 1.91 —
# older toolchains fail with cryptic "method not found" without this floor.
rust-version = "1.91"

[[bin]]
name = "aba"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
strsim = "0.11"
url = "2"
tiny_http = "0.12"
webbrowser = "1"
getrandom = "0.3"
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "test-util"] }

# Single source of truth for clippy lints — read by `cargo clippy` everywhere:
# the PostToolUse edit hook (warn), CI (`-- -D warnings`, promotes these to errors),
# and any manual run. Mirrors the former hardcoded flag list. To remediate:
#   cargo clippy --fix --allow-dirty --all-targets
# Groups get priority -1 so the individual `allow`s below (priority 0) override them.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_docs_in_private_items = "allow"
separated_literal_suffix = "allow"
implicit_return = "allow"
print_stderr = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
single_char_lifetime_names = "allow"
missing_inline_in_public_items = "allow"
self_named_module_files = "allow"
wildcard_enum_match_arm = "allow"
pattern_type_mismatch = "allow"
std_instead_of_core = "allow"
